[package]
name = "maintenance"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
docstr = "0.4.6"
ino_tracing = "0.1.1"
itertools = "0.14.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tap = "1.0.1"
tempfile = "3.23.0"
tracing = "0.1.41"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.clippy]
all = { priority = -1, level = "warn" }
pedantic = { priority = -1, level = "warn" }
nursery = { priority = -1, level = "warn" }
