---
keys:
  - &me "age17lvnmh99feams2pvfljw34k5s705uk89x6g26r4ml85yu0h2q9uswpmjm6"
  - &umi "age1rlhnksa8qplfkdecmnsr5v9nfjm3vnagxrertmz2z6gl0sjxr9rqf580cg"
  - &uk-01 "age1y5gnuyfwgcsgqqjdse9p257jpx7zfn9jf6l3zygcraxxfavuspnshguumg"

# N.B. path_regex is matched relative to .sops.yaml,
# in order to match directories from repo toplevel,
# DON'T prefix the regex with ".*/".
creation_rules:
  - path_regex: sops/umi/.*
    age: [*me, *umi]

  - path_regex: sops/uk-01/.*
    age: [*me, *uk-01]

  - path_regex: sops/shared/token--cloudflare
    age: [*me, *umi, *uk-01]

  - path_regex: sops/infra/.*
    age: [*me]

  - path_regex: home/.*
    age: [*me]
