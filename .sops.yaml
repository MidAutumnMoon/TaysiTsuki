  - &phia "age1n8syamacyke5y7nczgh85ftg5u5fm28zlsxdfjgesp5wq3n8upqs8532tl"
  - &uk-01 "age1y5gnuyfwgcsgqqjdse9p257jpx7zfn9jf6l3zygcraxxfavuspnshguumg"
  - &sjc-01 "age1yz293dkqg2uf0ddcf5efdxky3mlcvqpdlprpp9kaj4sqnynngveqjcwqhe"

# N.B. path_regex is matched relative to .sops.yaml,
# in order to match directories from repo toplevel,
# DON'T prefix the regex with ".*/".
creation_rules:
  - path_regex: infra/.*
    age: [*me]

  - path_regex: machine/sjc-01/.*
    age: [*me, *sjc-01]

  - path_regex: machine/uk-01/.*
    age: [*me, *uk-01]

  - path_regex: machine/ren/.*
    age: [*me, *ren]

  - path_regex: machine/phia/.*
    age: [*me, *phia]

  - age: [*me, *ren, *phia, *uk-01, *sjc-01]
