# Shout out to:
# - https://github.com/occivink/mpv-image-viewer
# - https://github.com/guidocella/mpv-image-config

[image-viewer]

# input related
input-conf = ~~/input-image-viewer.conf
input-preprocess-wheel = no

# scaling
scale = ewa_lanczossharp
dscale = ewa_lanczossharp
correct-downscaling

# misc
mute = yes
osc = no
sub-auto = no
audio-file-auto = no
term-status-msg =
save-position-on-quit = no
prefetch-playlist = yes

# loop
image-display-duration = inf
loop-file = inf
loop-playlist = inf

[extension.gif]
interpolation = no

[extension.png]
video-aspect-override = no

[extension.jpg]
video-aspect-override = no

[extension.jpeg]
profile = extension.jpg

[silent]
msg-level = all=no

# vim: ft=confini:
