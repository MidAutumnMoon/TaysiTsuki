hwdec=auto
vo=gpu-next
hwdec=vaapi
gpu-context=wayland
hdr-compute-peak=no
cache=yes

deband=no

window-maximized=yes
hr-seek = yes
force-seekable=yes

volume=90
replaygain=album

save-position-on-quit = yes
watch-later-dir = /dev/shm/mpv_watch_later
resume-playback = yes
resume-playback-check-mtime = yes

sub-visibility = no

include = ~~/profile-image-viewer.conf
