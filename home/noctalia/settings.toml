config_version = 13

[accessibility]
ui_scale = 1.1499999999999999

[backdrop]
enabled = true
tint_intensity = 0.25

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.74999998323619366
    border_width = 1.5
    center = []
    end = [ "media", "tray", "notifications", "volume", "brightness" ]
    padding = 13
    position = "right"
    scale = 1.2500000111758709
    start = [ "clock", "group:g1", "ram", "cat", "group:g2", "wallpaper" ]
    thickness = 45
    widget_spacing = 10

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network_rx", "network_tx" ]
        opacity = 0.0
        padding = 6.0

        [[bar.Main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "workspaces", "taskbar" ]
        opacity = 1.0
        padding = 6.0

[calendar]
enabled = true

[control_center]
hidden_tabs = [ "network", "bluetooth", "weather" ]
sidebar = "full"
sidebar_section = "full"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false

[dock]
position = "left"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 360.0

[lockscreen]
allow_empty_password = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1066.5
    cy = 1078.0
    output = "DP-2"
    placement_height = 1200.0
    placement_width = 2133.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 704.0
    cx = 1050.5
    cy = 552.0
    output = "DP-2"
    placement_height = 1200.0
    placement_width = 2133.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.5
        center_text = true
        clock_style = "digital"
        font_family = ""
        shadow = true

[notification]
history_retention_hours = 24
position = "bottom_right"

[osd]
background_opacity = 0.84999999999999998
offset_y = 20
scale = 1.1000000089406967

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
niri_overview_type_to_launch_enabled = true
polkit_agent = true
telemetry_enabled = true
ui_scale = 1.05

    [shell.animation]
    speed = 4.0

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
community_palette = "Oxocarbon"
mode = "light"
source = "wallpaper"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/teapot/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 300

    [wallpaper.default]
    path = "/home/teapot/Pictures/Wallpapers/709340.png"

    [wallpaper.last]
    path = "/home/teapot/Pictures/Wallpapers/709340.png"

    [wallpaper.monitors.DP-2]
    path = "/home/teapot/Pictures/Wallpapers/709340.png"

[weather]
enabled = false

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clipboard]
capsule = true

[widget.clock]
capsule = true
scale = 0.80000000000000004

[widget.launcher]
capsule = true

[widget.network_rx]
network_speed_compact = true
scale = 0.59999999999999998

[widget.network_tx]
network_speed_compact = true
scale = 0.59999999999999998

[widget.ram]
label_show_units = false
scale = 0.60000000000000009

[widget.taskbar]
icon_scale = 1.2000000000000002
minimal = true
only_active_workspace = true
scroll_repeat = "steps"

[widget.volume]
scale = 0.85000000000000009

[widget.wallpaper]
enabled = false

[widget.workspaces]
scale = 0.90000000000000013