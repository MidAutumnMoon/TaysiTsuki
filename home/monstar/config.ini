font-family = Maple Mono NL NF CN Light
font-size = 13
font-thicken = false
theme = Material Darker
background-opacity = 0.8

window-padding-x = 4
window-padding-y = 2

mouse-scroll-multiplier = precision:2,discrete:8
smooth-scrolling = true
renderer = vulkan

command = direct:/run/current-system/sw/bin/bash -i
