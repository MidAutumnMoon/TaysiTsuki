font-family = Maple Mono NL NF CN Light
font-size = 12.5
font-thicken = false
theme = Material Darker
background-opacity = 0.8
# background-opacity-cells = true

window-padding-x = 4
window-padding-y = 2

mouse-scroll-multiplier = precision:4,discrete:8
smooth-scrolling = true
renderer = vulkan

notify-on-command-finish = unfocused
notify-on-command-finish-action = no-bell,notify

command = direct:/run/current-system/sw/bin/bash -i

keybind = ctrl+==unbind
keybind = ctrl+shift+==unbind
keybind = ctrl+-=unbind
