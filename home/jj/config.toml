[user]
email = "me@418.im"
name = "MidAutumnMoon"

[aliases]
g = ["git"]
d = ["diff"]

# Disambiguation
e = ["edit"]
u = ["undo"]
a = ["abandon"]
s = ["status"]
sh = ["show"]
l = ["log"]

push = ["git", "push"]
fetch = ["git", "fetch"]
clone = ["git", "clone"]

# Alias for launching Blue Archive
ba = ["bookmark", "advance"]

# Fast logs
mine = ["log", "-r", "mine()"]
roots = ["log", "-r", "roots(mine())"]

sync = [
    "util", "exec", "--",
    "sh", "-c",
    "jj git fetch --all-remotes && jj rebase -d 'trunk()'"
]

ap = [
    "util", "exec", "--",
    "sh", "-c",
    '''
        set -eu
        op=$(jj op log --no-graph -n 1 -T 'id')
        # Restore on failures
        trap 'jj op restore --quiet "$op" >/dev/null 2>&1 || true' EXIT
        jj bookmark advance "$@"
        jj git push --dry-run
        printf "Push? [Y/n] "
        read -r ans
        case "$ans" in
            ""|y|Y) ;;
            *) exit 1 ;;
        esac
        jj git push
        trap - EXIT
    ''',
    "--"
]

[ui]
conflict-marker-style = "git"
default-command = "log"
diff-formatter = ":git"

[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/id_teapot.pub"

[git]
private-commits = "private()"

[templates]
draft_commit_description = '''
    concat(
        builtin_draft_commit_description,
        "\nJJ: ignore-rest\n",
        "JJ: ------------------------ >8 ------------------------\n",
        "JJ: Do not modify or remove the line above.\n",
        "JJ: Everything below it will be ignored.\n\n",
        diff.git()
    )
'''

[revsets]
bookmark-advance-to = 'closest_pushable(@)'

[revset-aliases]
"private()" = '''
    description(glob:"private:*")
    | description(glob:"wip:*")
'''

'closest_pushable(to)' = '''
    heads(
        ::to
        & mutable()
        & description(regex:"\\S")
        & (~empty() | merges())
        & ~(conflicts()::)
        & ~(private()::)
    )
'''

