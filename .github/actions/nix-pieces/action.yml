name: Some Nix Things

inputs:
  cachix_token: { required: true }
  upstream_caches:
    description: Add caches used while building ordinary package inputs
    required: false
    default: "true"

runs:
  using: composite

  steps:
    - name: Mount swap
      shell: bash
      run: |
        {
          F="/mnt/swapf"
          sudo swapoff --all
          sudo dd if=/dev/zero of="$F" bs=1M count=20480
          sudo chmod 600 "$F"
          sudo mkswap "$F"
          sudo swapon "$F"
        } &
        disown

    - name: Disable AppArmor
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        sudo aa-teardown || true
        sudo systemctl disable --now apparmor.service

    - name: Free up disk space
      shell: bash
      run: |
        sudo bash "$GITHUB_ACTION_PATH/freeup.bash" &
        disown

    - name: Setup Nix
      uses: cachix/install-nix-action@v31
      with:
        install_options: --no-daemon
        extra_nix_config: |
          experimental-features = nix-command flakes pipe-operators
          auto-optimise-store = false
          always-allow-substitutes = true
          max-jobs = 1
          sandbox = true
          sandbox-fallback = false

    - name: Configure nix
      shell: bash
      run: |
        conf="$HOME/.config/nix/nix.conf"
        mkdir -p "$(dirname "$conf")"
        builddir="/mnt/$(cat /proc/sys/kernel/random/uuid)"
        sudo mkdir -p "$builddir"
        sudo chmod 1777 "$builddir"
        # extra-* settings are additive; duplicate lines are valid.
        {
          echo "build-dir = ${builddir}"
          echo "extra-substituters = https://nuirrce.cachix.org/"
          echo "extra-trusted-public-keys = nuirrce.cachix.org-1:KQWa6ZfDkMPXeDiUpmyDhNw4CmgybPyeVklmi/1Rtqk="
          if [[ "${{ inputs.upstream_caches }}" == "true" ]]; then
            echo "extra-substituters = https://cache.numtide.com"
            echo "extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g="
          fi
        } >> "$conf"
        nix config show

    - name: Setup cachix
      uses: cachix/cachix-action@master
      with:
        installCommand: "nix profile install .#cachix"
        name: "nuirrce"
        pushFilter: '(NVIDIA.*\.run)'
        skipAddingSubstituter: true
        authToken: ${{ inputs.cachix_token }}
