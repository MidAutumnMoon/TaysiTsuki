name: "Build Packages & NixOS"

on:
    workflow_dispatch:
    push:
        paths:
            - "flake.*"
            - "packages/**"
            - "machine/**"
            - "nixos/**"
    schedule:
        #- cron: "0 */4 * * *"
        - cron: "0 0 */2 * *"

env:
    CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

jobs:
    list_groups:
        name: List package groups
        runs-on: ubuntu-latest
        defaults:
            run: { shell: bash }
        outputs:
            groups: ${{ steps.list_groups_step.outputs.groups }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with:
                  cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

            - name: List Groups
              id: list_groups_step
              run: |
                  TOOL=".#tsuki.__ci"
                  nix build --print-build-logs "$TOOL"
                  OUT=$( nix run "$TOOL" \
                      -- build -m "packages/tsuki.nix" -l )
                  echo "groups=${OUT}" >> "$GITHUB_OUTPUT"

    build_packages:
        name: Build Packages
        runs-on: ubuntu-latest
        defaults:
            run: { shell: bash }
        needs:
            - list_groups
        strategy:
            matrix:
                group: ${{ fromJSON(needs.list_groups.outputs.groups) }}
            fail-fast: false
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with: { cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}" }

            - name: Build Packages from Group
              run: |
                  TOOL=".#tsuki.__ci"
                  nix flake update
                  nix run "$TOOL" -- build \
                      -m "packages/tsuki.nix" \
                      -g "${{ matrix.group }}"

    list_nixos:
        name: List NixOS hostnames
        runs-on: ubuntu-latest
        defaults:
            run: { shell: bash }
        needs:
            - build_packages
        outputs:
            hostnames: ${{ steps.hostnames_step.outputs.hostnames }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with:
                  cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

            - name: List NixOS Hostnames
              id: hostnames_step
              run: |
                  TOOL=".#tsuki.__ci"
                  nix build --print-build-logs "$TOOL"
                  OUT=$( nix run "$TOOL" -- nixos -l )
                  echo "hostnames=${OUT}" >> "$GITHUB_OUTPUT"

    build_nixos:
        name: Build NixOS
        runs-on: ubuntu-latest
        needs:
            - list_nixos
        defaults:
            run: { shell: bash }
        strategy:
            matrix:
                hostname: ${{fromJSON(needs.list_nixos.outputs.hostnames)}}
            fail-fast: false
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with: { cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}" }

            - name: Build NixOS
              run: |
                  TOOL=".#tsuki.__ci"
                  nix flake update
                  nix build --print-build-logs "$TOOL"
                  nix run "$TOOL" -- nixos -n "${{ matrix.hostname }}"
