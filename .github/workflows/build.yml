name: "Build Packages & NixOS"

on:
    workflow_dispatch:
    push:
        paths:
            - "flake.*"
            - "packages/**"
            - "machine/**"
            - "nixos/**"
    schedule:
        #- cron: "0 */4 * * *"
        - cron: "0 0 */2 * *"

env:
    CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

jobs:
    list_matrix:
        name: List build matrix
        runs-on: ubuntu-latest
        defaults:
            run: { shell: bash }
        outputs:
            groups: ${{ steps.list_matrix_step.outputs.groups }}
            hostnames: ${{ steps.list_matrix_step.outputs.hostnames }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with:
                  cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

            - name: List Matrix
              id: list_matrix_step
              run: |
                  TOOL=".#tsuki.__ci"
                  nix build --print-build-logs "$TOOL"
                  # N.B. Don't use "GROUPS", in Github Action environment
                  # $GROUPS is already set, so bash errors out if this
                  # re-declares GROUPS.
                  PACKAGE_GROUPS=$( nix run "$TOOL" \
                      -- build -m "packages/tsuki.nix" -l )
                  NIXOS_HOSTS=$( nix run "$TOOL" -- nixos -l )
                  echo "groups=${PACKAGE_GROUPS}" >> "$GITHUB_OUTPUT"
                  echo "hostnames=${NIXOS_HOSTS}" >> "$GITHUB_OUTPUT"

    build_packages:
        name: Build Packages
        runs-on: ubuntu-latest
        defaults:
            run: { shell: bash }
        needs:
            - list_matrix
        strategy:
            matrix:
                group: ${{ fromJSON(needs.list_matrix.outputs.groups) }}
            fail-fast: false
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with: { cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}" }

            - name: Build Packages from Group
              run: |
                  TOOL=".#tsuki.__ci"
                  nix flake update
                  nix run "$TOOL" -- build \
                      -m "packages/tsuki.nix" \
                      -g "${{ matrix.group }}"

    build_nixos:
        name: Build NixOS
        runs-on: ubuntu-latest
        needs:
            - build_packages
            - list_matrix
        defaults:
            run: { shell: bash }
        strategy:
            matrix:
                hostname: ${{ fromJSON(needs.list_matrix.outputs.hostnames) }}
            fail-fast: false
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup nix
              uses: ./.github/actions/nix-pieces
              with: { cachix_token: "${{ secrets.CACHIX_AUTH_TOKEN }}" }

            - name: Build NixOS
              run: |
                  TOOL=".#tsuki.__ci"
                  nix flake update
                  nix build --print-build-logs "$TOOL"
                  nix run "$TOOL" -- nixos -n "${{ matrix.hostname }}"
